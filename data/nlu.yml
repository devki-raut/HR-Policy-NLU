version: '3.1'
nlu:
- intent: greet
  examples: |
    - hello
    - hi
    - hey there
    - good morning
    - hello HR
    - hi assistant
- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you later
    - thanks goodbye
    - that is all
    - quit
- intent: ask_leave
  examples: |
    - How many days of annual leave do I get?
    - What is my annual leave entitlement?
    - How much annual leave is credited each year?
    - How do I request annual leave?
    - What is the sick leave policy?
    - How many sick days are available?
    - Do I need a medical certificate for sick leave?
    - Can I take vacation next week?
    - Who approves my leave request?
    - Tell me about parental leave
    - What is the annual leave allowance?
    - How early should I apply for leave?
    - What is the bereavement leave policy?
    - What is the funeral leave policy?
    - Can I take time off for a family funeral?
    - Can I take bereavement leave after a death in the family?
    - How much bereavement leave am I entitled to?
    - How do I request bereavement leave?
    - How do I apply for funeral leave?
    - What documents are needed for bereavement leave?
    - What are the bereavement leave benefits?
    - Is paid leave available after a family member dies?
    - How long is bereavement leave for a parent or spouse?
    - I need to take time off for a funeral, what policy applies?
    - My parent passed away, how much leave can I take?
    - My spouse died, what leave entitlements are available?
    - What is the company policy for time off after a death in the family?
    - How do I request parental leave?
    - How do I apply for leave after the birth of a child?
    - What leave options are available for new parents?
    - How do I request sick leave?
    - Who approves my annual leave request?
    - How much leave can I take for family emergencies?
    - How many days of paternity leave are allowed?
    - What are the paternity leave rules after childbirth?
- intent: ask_remote_work
  examples: |
    - Can I work from home?
    - What is the remote work policy?
    - How many days can I work remotely?
    - Who approves remote work?
    - How do I request remote work?
    - Is hybrid working allowed?
    - Do I need to attend the office?
    - Can my role work from home?
    - What are the rules for WFH?
    - Tell me about office attendance
- intent: ask_benefits
  examples: |
    - What health insurance benefits are available?
    - When does medical coverage start?
    - How do I enroll for insurance?
    - Are dependents covered by health insurance?
    - Tell me about employee benefits
    - What medical benefits do I receive?
    - Can HR explain my insurance coverage?
    - Where do I find the health plan?
    - Does my family get health coverage?
    - When do benefits begin?
- intent: ask_expenses
  examples: |
    - How do I claim travel expenses?
    - What is the reimbursement deadline?
    - Do I need receipts for expenses?
    - Can I claim personal purchases?
    - Who approves expense claims?
    - How do I submit a travel reimbursement?
    - What expenses are reimbursable?
    - When should I submit travel receipts?
    - Explain the expense policy
    - Can I get reimbursed for a business trip?
- intent: ask_conduct
  examples: |
    - How do I report harassment?
    - How do I raise a grievance?
    - What is the workplace conduct policy?
    - Can I report discrimination confidentially?
    - Who handles workplace complaints?
    - What happens after I complain to HR?
    - Is retaliation prohibited?
    - I need to report workplace misconduct
    - How do I contact HR about harassment?
    - What is the grievance review process?
- intent: ask_onboarding
  examples: |
    - How long is the probation period?
    - When is onboarding orientation?
    - What do new employees need to do?
    - Who coordinates my probation review?
    - Tell me about joining the company
    - What happens in my first week?
    - How does onboarding work?
    - When does my probation end?
    - What is the orientation schedule?
    - Explain the probation policy
- intent: out_of_scope
  examples: |
    - What is the weather?
    - Write me a poem
    - Tell me a joke
    - What is my bank balance?
    - Book a flight
    - What is my coworker salary?
    - Give me employee medical records
    - Show all employee personal details
    - Reset my password
    - Order lunch
