version: '3.1'
intents:
- greet
- help
- ask_upcoming_holidays
- ask_holiday_list
- goodbye
- ask_leave
- ask_remote_work
- ask_benefits
- ask_expenses
- ask_conduct
- ask_onboarding
- ask_personal_leave_balance
- provide_employee_code
- out_of_scope
- nlu_fallback
- policy_bereavement
- policy_maternity
- policy_paternity
- policy_posh
- policy_general_leave
- policy_referral
responses:
  utter_greet:
  - text: 'Hi! Ask me about leave, remote work, benefits, expenses, conduct or onboarding.

      I answer from the policy library with source references.

      '
  utter_help:
  - text: EmployeeAssist can answer grounded HR policy questions, show your live Darwinbox
      leave balance, list upcoming holidays, and display the full holiday calendar.
      Try “Show my leaves”, “Show the next five holidays”, or ask a policy question.
  utter_goodbye:
  - text: Goodbye! Contact HR if you need help with your individual circumstances.
  utter_out_of_scope:
  - text: 'I can explain HR policies, but cannot access employee records or perform

      HR transactions. Please ask a policy question or contact HR.

      '
  utter_clarify:
  - text: 'Could you rephrase with a specific topic: leave, remote work, benefits,

      expenses, conduct or onboarding?

      '
actions:
- action_answer_policy
- action_personal_leave_balance
- action_holiday_list
- action_remember_employee_code
session_config:
  session_expiration_time: 30
  carry_over_slots_to_new_session: false
